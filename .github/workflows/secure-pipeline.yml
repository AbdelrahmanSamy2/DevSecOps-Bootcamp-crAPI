name: Secure Pipeline

on:
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        uses: docker://docker.io/zricethezav/gitleaks:latest
        continue-on-error: true
        with:
          args: >
            detect
            --source=.
            --report-format=sarif
            --report-path=gitleaks-report.sarif
            --redact
            --verbose

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 30

      - name: Fail job if secrets were found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "Gitleaks detected potential secrets. See the gitleaks-report artifact for details."
          exit 1

  sast-scan:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        id: semgrep
        uses: docker://docker.io/semgrep/semgrep:latest
        continue-on-error: true
        with:
          args: >
            semgrep scan
            --config=auto
            --sarif
            --output=semgrep-report.sarif
            --verbose

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.sarif
          retention-days: 30

      - name: Fail job if findings were detected
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "Semgrep detected findings. See the semgrep-report artifact for details."
          exit 1

  sca-scan:
    name: Dependency Scanning (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy
        id: trivy
        uses: docker://docker.io/aquasec/trivy:latest
        continue-on-error: true
        with:
          args: >
            fs
            --scanners=vuln
            --severity=CRITICAL,HIGH,MEDIUM
            --format=sarif
            --output=trivy-report.sarif
            --exit-code=1
            .

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.sarif
          retention-days: 30

      - name: Fail job if vulnerabilities were detected
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "Trivy detected vulnerable dependencies. See the trivy-report artifact for details."
          exit 1
